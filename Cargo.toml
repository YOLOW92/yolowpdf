[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YOLOW92/yolowpdf"
rust-version = "1.89"

# Release builds use fat LTO and one codegen unit, as the extracted code was
# measured upstream. `release-fast` is for iterative benchmarking.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.quick]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.quick.package."*"]
opt-level = 2
