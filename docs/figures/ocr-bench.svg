  <rect x="733.0" y="218" width="25.5" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="766.5" y="230" class="val-hi">1.257 p/s  |  593 MB  (106.6 s)</text>
  <text x="723.0" y="265" text-anchor="end" class="label-hi">v2 Full (110MB GPU+math)</text>
  <rect x="733.0" y="253" width="7.4" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="748.4" y="265" class="val-teal">0.364 p/s  |  939 MB  (367.7 s)</text>
  <text x="723.0" y="300" text-anchor="end" class="label-hi">v2 Full (110MB CPU+math)</text>
  <rect x="733.0" y="288" width="7.0" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="748.0" y="300" class="val-teal">0.345 p/s  |  831 MB  (388.4 s)</text>
  <text x="723.0" y="335" text-anchor="end" class="label">v1 Upstream (892MB GPU+math)</text>
  <rect x="733.0" y="323" width="5.0" height="16" rx="4" fill="#94a3b8"/>
