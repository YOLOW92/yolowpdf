  <text x="38" y="109" class="panel-title">OCR Score ↑ (All-Items &amp; No-Baseline)</text>
  <text x="38" y="127" class="panel-sub">134 scanned pages · Unfinished capped pages count as 0</text>
  <text x="206" y="160" text-anchor="end" class="label-hi">yolowpdf-ocr v1 (892MB GPU+math)</text>
  <rect x="216" y="148" width="56.1" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="280.1" y="160" class="val-teal">0.5428  (no-base 0.3143 · 134/134)</text>
  <rect x="28" y="178" width="477.0" height="26" rx="5" fill="#eef2ff"/>
  <text x="206" y="195" text-anchor="end" class="label-hi">yolowpdf-ocr v2 (110MB GPU+math)</text>
  <rect x="216" y="183" width="49.6" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="273.6" y="195" class="val-hi">0.4799  (no-base 0.2199 · 134/134)</text>
  <text x="206" y="230" text-anchor="end" class="label-hi">yolowpdf-ocr v2 (110MB CPU+math)</text>
  <rect x="216" y="218" width="49.6" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="273.6" y="230" class="val-hi">0.4799  (no-base 0.2199 · 134/134)</text>
  <text x="206" y="265" text-anchor="end" class="label-hi">yolowpdf-ocr v2 (16MB GPU text)</text>
  <rect x="216" y="253" width="40.3" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="264.3" y="265" class="val-hi">0.3897  (no-base 0.0846 · 134/134)</text>
  <text x="206" y="300" text-anchor="end" class="label">Docling OCR GPU (capped)</text>
  <rect x="216" y="288" width="23.3" height="16" rx="4" fill="#94a3b8"/>
  <text x="247.3" y="300" class="val">0.2251  (no-base 0.0989 · 64/134)</text>
  <text x="206" y="335" text-anchor="end" class="label">Docling OCR CPU (capped)</text>
  <rect x="216" y="323" width="5.4" height="16" rx="4" fill="#94a3b8"/>
  <text x="229.4" y="335" class="val">0.0519  (no-base 0.0257 · 14/134)</text>
  <rect x="527.0" y="84" width="493.0" height="291" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <text x="545.0" y="109" class="panel-title">Throughput (pages/s ↑) &amp; Peak Worker Memory (MB ↓)</text>
  <text x="545.0" y="127" class="panel-sub">Pure-Rust CPU/CUDA inference · MTP-4 lossless formula decoding</text>
  <rect x="535.0" y="143" width="477.0" height="26" rx="5" fill="#eef2ff"/>
  <text x="723.0" y="160" text-anchor="end" class="label-hi">v2 Latin (11MB GPU text)</text>
  <rect x="733.0" y="148" width="72.3" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="813.3" y="160" class="val-hi">3.567 p/s  |  628 MB  (37.6 s)</text>
  <text x="723.0" y="195" text-anchor="end" class="label-hi">v2 Multi (16MB GPU text)</text>
  <rect x="733.0" y="183" width="58.3" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="799.3" y="195" class="val-hi">2.879 p/s  |  665 MB  (46.5 s)</text>
