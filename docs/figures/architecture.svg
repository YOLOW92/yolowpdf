  <text x="38" y="321" class="label-hi">Unified Output: PdfDocument</text>
  <text x="235" y="321" class="code">markdown · pages · metadata · inferred_title · images (file_name / data_url) · warnings · ocr</text>
  <text x="38" y="340" class="panel-sub">Adaptive OLS + EVT parse timeouts (yolowpdf-stat) · Process allocator tuning (yolowpdf-sys) · Base64 Data URL encoding powered by yolow64 0.3</text>
