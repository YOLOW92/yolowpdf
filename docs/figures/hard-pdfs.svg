<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" width="100%" role="img">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 18.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.2px; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .panel-title { font: 700 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .panel-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .label-hi { font: 700 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .val { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #475569; }
    .val-hi { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #4f46e5; }
    .val-teal { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0d9488; }
    .axis { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #64748b; }
    .kpi-num { font: 800 22px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: -0.5px; }
    .kpi-title { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .kpi-sub { font: 400 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    .badge { font: 700 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .code { font: 600 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0f172a; }
    .note { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
  </style>
  <rect width="1040" height="290" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="0" y="0" width="1040" height="68" rx="14" fill="url(#headerGrad)"/>
  <rect x="0" y="54" width="1040" height="14" fill="url(#headerGrad)"/>
  <text x="26" y="30" class="title">Stress &amp; Malformed PDF Corpus — pdf.js Test Suite (1,089 Files)</text>
  <text x="26" y="50" class="subtitle">Broken xref tables, truncated streams, encrypted objects, exotic CJK CMaps &amp; pathological layouts</text>
  <rect x="824" y="19" width="194" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="921.0" y="37" text-anchor="middle" class="badge" fill="#e0e7ff">1,663 files/s · 0 Panics</text>
  <rect x="20" y="84" width="493.0" height="188" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <text x="38" y="109" class="panel-title">Throughput (files/s ↑) &amp; Wall Time</text>
  <text x="38" y="127" class="panel-sub">1,089 difficult/corrupt PDFs from the pdf.js test suite</text>
  <rect x="28" y="145" width="477.0" height="28" rx="5" fill="#eef2ff"/>
  <text x="106" y="163" text-anchor="end" class="label-hi">yolowpdf</text>
  <rect x="116" y="150" width="99.0" height="18" rx="4" fill="url(#primaryGrad)"/>
  <text x="225.0" y="163" class="val-hi">1,663 files/s  (0.496 s wall · 830/1089)</text>
  <text x="106" y="205" text-anchor="end" class="label">pymupdf4llm*</text>
  <rect x="116" y="192" width="8.0" height="18" rx="4" fill="#94a3b8"/>
  <text x="134.0" y="205" class="val">1.31 files/s  (640.9 s wall · 841/1089)</text>
  <text x="38" y="249" class="panel-sub">*pymupdf4llm ran on an NTFS mount (different I/O; not a controlled speed test).</text>
  <rect x="527.0" y="84" width="493.0" height="188" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <text x="545.0" y="109" class="panel-title">Peak Memory (MB ↓) &amp; Resource Safety Guards</text>
  <text x="545.0" y="127" class="panel-sub">Bounded stream allocations (0.1.1+) &amp; catch_unwind boundary</text>
  <rect x="535.0" y="145" width="477.0" height="28" rx="5" fill="#ecfdf5"/>
  <text x="632.0" y="163" text-anchor="end" class="label-hi">yolowpdf</text>
  <rect x="642.0" y="150" width="8.0" height="18" rx="4" fill="url(#tealGrad)"/>
  <text x="660.0" y="163" class="val-teal">104 MB peak  (39.4x less memory)</text>
  <text x="632.0" y="205" text-anchor="end" class="label">pymupdf4llm</text>
  <rect x="642.0" y="192" width="168.0" height="18" rx="4" fill="#94a3b8"/>
  <text x="820.0" y="205" class="val">4,094 MB peak</text>
  <text x="545.0" y="249" class="panel-sub">Pre-allocation budget checks on PNG/TIFF predictors &amp; stream filters.</text>
</svg>
