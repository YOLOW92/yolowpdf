name: Publish

# 推 v* 标签时把 yolowpdf 和 yolowpdf-ocr 按依赖顺序发到 crates.io。
# 底层无变动的 crate（yolowpdf-stat、yolowpdf-infer、yolowpdf-gpu、yolowpdf-sys）保持各自已发布的 0.1.x 版本。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish from
        required: true
        type: string
      dry_run:
        description: Package and verify without uploading
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" == "v$version" ]] || {
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          }
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            git ls-remote --tags origin "refs/tags/$tag" | grep -q . || {
              echo "tag $tag does not exist" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package yolowpdf
        run: cargo publish -p yolowpdf --locked --dry-run
      - name: Publish yolowpdf
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p yolowpdf --locked
      - name: Wait for yolowpdf on crates.io index
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for i in $(seq 1 36); do
            if curl -sf -A "yolowpdf-publish" "https://index.crates.io/yo/lo/yolowpdf" | grep -q "\"vers\":\"$VERSION\""; then
              echo "yolowpdf $VERSION is live in sparse index"
              exit 0
            fi
            echo "waiting for yolowpdf $VERSION in crates.io index ($i/36)..."
            sleep 5
          done
          echo "timed out waiting for yolowpdf $VERSION in crates.io index" >&2
          exit 1
      - name: Package yolowpdf-ocr
        if: github.event_name == 'push' || inputs.dry_run == false
        run: cargo publish -p yolowpdf-ocr --locked --dry-run
      - name: Publish yolowpdf-ocr
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p yolowpdf-ocr --locked
